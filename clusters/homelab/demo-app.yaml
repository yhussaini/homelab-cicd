# Tells Flux to keep the cluster in sync with k8s/demo-app in this repo.
# The flux-system GitRepository is created by `flux bootstrap`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-app
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/demo-app
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
