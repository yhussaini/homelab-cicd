name: CI

# test   -> every push and pull request that touches the app
# build  -> push to main: build the image and push it to ghcr.io
# deploy -> push to main: write the new image tag into k8s/demo-app/deployment.yaml
#           Flux in the cluster sees that commit and rolls the new version out.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site checks (HTML, example-only domains, nginx config)
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Smoke test the container
        run: |
          docker build -t demo-app:test --build-arg APP_VERSION=ci-test app
          docker run -d --name smoke -p 8080:8080 demo-app:test
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "<title>"
          curl -fs http://127.0.0.1:8080/version | grep -q ci-test
          echo "smoke test passed"
          docker rm -f smoke

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA::7}"
          echo "repo=ghcr.io/${owner}/demo-app" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/demo-app:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point the deployment at the new image
        run: |
          sed -i "s#image: ghcr.io/.*/demo-app:.*#image: ${{ needs.build.outputs.image }}#" k8s/demo-app/deployment.yaml
          git diff
      - name: Commit and push
        # Commits made with GITHUB_TOKEN do not start another workflow run, so this cannot loop.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/demo-app/deployment.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy: demo-app ${{ needs.build.outputs.image }}"
          git pull --rebase origin main
          git push origin HEAD:main
